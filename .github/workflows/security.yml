name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan Python and Swift code
        run: semgrep scan --config auto --config .semgrep.yml --error

  dependency-licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies and license scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-licenses

      - name: Generate dependency license report
        run: >-
          pip-licenses
          --from=mixed
          --format=markdown
          --with-urls
          --output-file=dependency-licenses.md

      - name: Reject dependencies without a declared license
        run: pip-licenses --from=mixed --fail-on="UNKNOWN;UNLICENSED;NOASSERTION"

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-license-report
          path: dependency-licenses.md
          if-no-files-found: warn

