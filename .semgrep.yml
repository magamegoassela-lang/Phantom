rules:
  - id: python-dynamic-code-execution
    languages: [python]
    severity: ERROR
    message: Avoid dynamic code execution; validate and parse input explicitly.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: python-shell-true
    languages: [python]
    severity: ERROR
    message: shell=True can enable command injection; pass an argument list without a shell.
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: python-insecure-deserialization
    languages: [python]
    severity: ERROR
    message: Do not deserialize untrusted data with pickle or unsafe YAML loading.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: yaml.load(...)

  - id: python-disabled-tls-verification
    languages: [python]
    severity: ERROR
    message: TLS certificate verification must not be disabled.
    pattern-either:
      - pattern: requests.get(..., verify=False, ...)
      - pattern: requests.post(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)

